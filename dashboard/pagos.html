<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/usuario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="sidebar">
        <button id="btnUsuarios" class="btn btn-outline-primary">Usuarios</button>
        <button id="btnPagos" class="btn btn-outline-primary">Pagos</button>
        <button id="btnCamaras" class="btn btn-outline-primary">Cámaras</button>
        <button id="btnAcceso-puerta" class="btn btn-outline-primary">Acceso Puerta</button>
        <hr>
        <button class="btn btn-outline-secondary">Configuración</button>
        <button class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Sección de Pagos</h3>
            <div>
                <button id="btnGuardarEdicion" class="btn btn-outline-success me-2" style="display:none;">
                    Guardar
                </button>
                <button id="btnCancelarEdicion" class="btn btn-outline-danger me-2" style="display:none;">
                    Cancelar
                </button>
                <button id="btnCrearPago" class="btn btn-primary" data-bs-toggle="modal"
                    data-bs-target="#modalCrearUsuario">
                    Crear +
                </button>
            </div>
        </div>


        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Placa</th>
                        <th>Fecha de Pago</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Final</th>
                        <th>Valor</th>
                        <th>Ver detalle</th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody id="tablaPagos">
                    <!-- Se llena por JS -->
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end align-items-center mt-3">
            <button id="prevPage" class="btn btn-outline-secondary me-2">&lt;</button>
            <span id="pageInfo">1</span>
            <button id="nextPage" class="btn btn-outline-secondary ms-2">&gt;</button>
        </div>
    </div>

    <div class="modal fade" id="detallePagoModal" tabindex="-1" aria-labelledby="detallePagoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="detallePagoLabel">
                        <i class="bi bi-receipt-cutoff me-2"></i> Detalle del Recibo OCR
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center">
                        <img id="imagenRecibo" src="" alt="Recibo" class="img-fluid border rounded shadow-sm"
                            style="max-height: 400px;" />
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear Pago -->
    <div class="modal fade" id="modalCrearPago" tabindex="-1" aria-labelledby="modalCrearPagoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white rounded-top-4">
                    <h5 class="modal-title d-flex align-items-center gap-2" id="modalCrearPagoLabel">
                        <i class="bi bi-cash-coin"></i> Registrar Pago Manualmente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formCrearPago" class="needs-validation" novalidate>
                        <!-- Usuario (ID) -->
                        <div class="mb-3">
                            <label class="form-label">ID de Usuario</label>
                            <input type="number" class="form-control" id="inputUserId" required>
                        </div>
                        <!-- Placa -->
                        <div class="mb-3">
                            <label class="form-label">Placa</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-car-front-fill"></i></span>
                                <input type="text" class="form-control" id="inputPlacaPago" required>
                            </div>
                        </div>
                        <!-- Fecha inicio servicio -->
                        <div class="mb-3">
                            <label class="form-label">Fecha Inicio de Servicio</label>
                            <input type="date" class="form-control" id="inputServiceStart" required>
                        </div>
                        <!-- Fecha fin servicio -->
                        <div class="mb-3">
                            <label class="form-label">Fecha Fin de Servicio</label>
                            <input type="date" class="form-control" id="inputServiceEnd" required>
                        </div>
                        <!-- Imagen recibo -->
                        <div class="mb-3">
                            <label class="form-label">Comprobante de Pago</label>
                            <input type="file" class="form-control" id="inputPagoImage" accept="image/*">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="checkSinTransferencia">
                                <label class="form-check-label text-muted" for="checkSinTransferencia">
                                    Sin transferencia (registrar sin imagen)
                                </label>
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-success" id="btnGuardarPago">
                        <i class="bi bi-save-fill"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/pagos.js"></script>

</body>



</html>
