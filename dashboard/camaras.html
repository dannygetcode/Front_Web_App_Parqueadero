<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Sección de Cámaras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/camaras.css">
</head>

<body>
  <div class="sidebar">
    <button id="btnUsuarios" class="btn btn-outline-primary">Usuarios</button>
    <button id="btnPagos" class="btn btn-outline-primary">Pagos</button>
    <button id="btnCamaras" class="btn btn-primary">Cámaras</button>
    <button id="btnAcceso-puerta" class="btn btn-outline-primary">Acceso Puerta</button>
    <hr>
    <button class="btn btn-outline-secondary">Configuración</button>
    <button class="btn btn-danger">Cerrar Sesión</button>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>SECCIÓN DE CÁMARAS</h3>
      <button class="btn btn-outline-dark">Ver Grabaciones</button>
    </div>

    <div class="row">
      <div class="col-md-6 mb-4">
        <h5>Cámara 1</h5>
        <div id="camara-box-1" class="camara-box mb-2 text-center">
          Cargando cámara…
        </div>
        <div class="d-flex justify-content-between">
          <button id="btnOff1" class="btn btn-outline-danger w-50 me-2">Apagar</button>
          <button id="btnOn1" class="btn btn-outline-success w-50">Encender</button>
        </div>
      </div>
      
      <div class="col-md-6 mb-4">
        <h5>Cámara 2</h5>
        <div id="camara-box-2" class="camara-box mb-2 text-center">
          Cargando cámara…
        </div>
        <div class="d-flex justify-content-between">
          <button id="btnOff2" class="btn btn-outline-danger w-50 me-2">Apagar</button>
          <button id="btnOn2" class="btn btn-outline-success w-50">Encender</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("btnUsuarios").addEventListener("click", () => {
        window.location.href = "../dashboard/usuarios.html";
      });

      document.getElementById("btnPagos").addEventListener("click", () => {
        window.location.href = "../dashboard/pagos.html";
      });
    </script>

    <script src="../js/camaras.js"></script>
</body>

</html>
