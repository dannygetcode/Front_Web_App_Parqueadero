<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/usuario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <div class="sidebar">
        <button id="btnUsuarios" class="btn btn-outline-primary">Usuarios</button>
        <button id="btnPagos" class="btn btn-outline-primary">Pagos</button>
        <button id="btnCamaras" class="btn btn-outline-primary">Cámaras</button>
        <button id="btnAcceso-puerta" class="btn btn-outline-primary">Acceso Puerta</button>
        <hr>
        <button class="btn btn-outline-secondary">Configuración</button>
        <button class="btn btn-danger">Cerrar Sesión</button>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Sección de Usuarios</h3>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex gap-2">
                    <button id="btnGuardarEdicion" class="btn btn-success" style="display:none;">Guardar</button>
                    <button id="btnCancelarEdicion" class="btn btn-secondary" style="display:none;">Cancelar</button>
                </div>
                <div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearUsuario">Crear
                        +</button>
                </div>
            </div>


        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Placa</th>
                        <th>Número de Teléfono</th>
                        <th>Código de Verificación</th>
                        <th>PIN</th>
                        <th>Datos Completos</th>
                        <th>Registros de Pagos</th>
                        <th>Estado</th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <!-- Filas se agregarán con JS -->
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-end align-items-center mt-3">
            <button id="prevPage" class="btn btn-outline-secondary me-2">&lt;</button>
            <span id="pageInfo">1</span>
            <button id="nextPage" class="btn btn-outline-secondary ms-2">&gt;</button>
        </div>

    </div>


    <!-- Modal Ver Detalle -->
    <!-- Modal Mejorado -->
    <div class="modal fade" id="detalleUsuarioModal" tabindex="-1" aria-labelledby="detalleUsuarioLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="detalleUsuarioLabel">
                        <i class="bi bi-person-lines-fill me-2"></i>Datos del Usuario
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="detalleUsuarioForm" class="row g-3">
                        <input type="hidden" id="detalleId">
                        <div class="col-md-6">
                            <label for="detalleNombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="detalleNombre" required>
                        </div>
                        <div class="col-md-6">
                            <label for="detalleApellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="detalleApellido" required>
                        </div>
                        <div class="col-md-6">
                            <label for="detalleTelefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="detalleTelefono" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="detallePlaca" class="form-label">Placa</label>
                            <input type="text" class="form-control" id="detallePlaca">
                        </div>
                        <div class="col-md-6">
                            <label for="detalleCodigo" class="form-label">Código Verificación</label>
                            <input type="text" class="form-control" id="detalleCodigo" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="detallePin" class="form-label">PIN</label>
                            <input type="text" class="form-control" id="detallePin" readonly>
                        </div>
                    </form>
                </div>



                <div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="guardarCambiosBtn">
                            <i class="bi bi-check-circle me-1"></i>Guardar
                        </button>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <!-- Modal Registros de Pagos -->
    <div class="modal fade" id="modalPagosUsuario" tabindex="-1" aria-labelledby="pagosLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="pagosLabel">
                        <i class="bi bi-receipt-cutoff me-2"></i>Registros de Pagos
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha de Pago</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPagosUsuario">
                            <!-- Dinámico -->
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer bg-light">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal Crear Usuario -->
    <div class="modal fade" id="modalCrearUsuario" tabindex="-1" aria-labelledby="modalCrearUsuarioLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white rounded-top-4">
                    <h5 class="modal-title d-flex align-items-center gap-2" id="modalCrearUsuarioLabel">
                        <i class="bi bi-person-plus-fill"></i> Registrar Usuario Manualmente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formCrearUsuario" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Placa</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-car-front-fill"></i></span>
                                <input type="text" class="form-control" id="inputPlaca" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número de Teléfono</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-phone-fill"></i></span>
                                <input type="text" class="form-control" id="inputTelefono" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">PIN (4 dígitos)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="number" class="form-control" id="inputPin" required minlength="4"
                                    maxlength="4">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-success" id="btnGuardarUsuario">
                        <i class="bi bi-save-fill"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCambioEstado" tabindex="-1" aria-labelledby="modalEstadoLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="modalEstadoLabel">Cambiar Estado del Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="estadoUsuarioId">
                    <label for="selectNuevoEstado" class="form-label">Nuevo Estado</label>
                    <select id="selectNuevoEstado" class="form-select">
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="VENCIDO">VENCIDO</option>
                        <option value="SUSPENDIDO">SUSPENDIDO</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnConfirmarCambioEstado">Guardar</button>
                </div>
            </div>
        </div>
    </div>





    <!-- Bootstrap JS Bundle (incluye Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>





</body>
<script defer src="../js/usuarios.js"></script>

</html>
