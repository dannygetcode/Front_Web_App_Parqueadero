<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrador - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

  <div class="card p-4 shadow" style="width: 22rem;">
    <h4 class="text-center mb-3">Bienvenido al Sistema Administrador</h4>
    <form id="loginForm">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Usuario" id="username" required />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Contraseña" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
